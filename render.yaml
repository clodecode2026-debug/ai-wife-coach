# Render Blueprint: AI Wife Coach
services:
  - type: web
    name: ai-wife-coach
    runtime: python
    plan: free
    repo: https://github.com/clodecode2026-debug/ai-wife-coach
    branch: main

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: APP_PIN
        value: "2509"
      - key: AG_BASE_URL
        sync: false
      - key: AG_API_KEY
        sync: false
      - key: AG_MODEL
        value: antigravity-3.8-flash
      - key: AG_MODEL_FALLBACK
        value: antigravity-3.8-pro
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: S3_ENDPOINT
        value: https://gateway.storjshare.io
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: agent-files
      - key: S3_REGION
        value: us-east-1
      - key: IDLE_SLEEP_MINUTES
        value: "14"
      - key: SERVICE_URL
        sync: false